{% extends "base.html" %}

{% block content %}
  <div class="pj" id="pj-root">
    <div class="pj-head">
      <h2 class="page-title pj-title">Проекты</h2>
      <span class="pj-count" id="pj-count"></span>
      <span class="pj-spacer"></span>
      {% if projects_ctx.canEdit %}
        <button type="button" class="button is-primary" id="pj-create">+ Создать проект</button>
      {% endif %}
    </div>

    <div class="pj-kpis" id="pj-kpis"></div>

    <div class="pj-card">
      <div class="pj-frow">
        <div class="pj-search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
          <input id="pj-q" type="search" placeholder="Поиск: договор, заказчик, исполнитель, руководитель" autocomplete="off" aria-label="Поиск по проектам" />
        </div>
        <div class="pj-frow pj-frow--tight" id="pj-msels"></div>
        <span class="pj-spacer"></span>
        <div class="pj-seg" id="pj-act" role="group" aria-label="Какие проекты показывать"></div>
        <label class="pj-group">Группировать:
          <select id="pj-group">
            <option value="none">Нет</option>
            <option value="status">По статусу</option>
            {% if projects_ctx.showChief %}<option value="chief">По руководителю</option>{% endif %}
            <option value="client">По заказчику</option>
          </select>
        </label>
      </div>
      <div class="pj-chips" id="pj-schips"></div>
      <div class="pj-tags" id="pj-tags"></div>
    </div>

    <div class="pj-lt" id="pj-lt"></div>
    <div class="pj-foot"><span id="pj-foot-l"></span><div class="pj-pager" id="pj-pager"></div></div>
  </div>

  <div class="pj-ov" id="pj-ov"></div>
  <aside class="pj-dr" id="pj-dr" aria-hidden="true" aria-label="Карточка проекта">
    <form method="post" id="pj-form" novalidate>
      <header>
        <div class="pj-dr__g"><h3 id="pj-dr-t">Проект</h3><div class="pj-dr__sub" id="pj-dr-s"></div></div>
        <button type="button" class="button is-light is-small" id="pj-dr-x" aria-label="Закрыть">✕</button>
      </header>
      <div class="pj-dr__body" id="pj-dr-b"></div>
      <footer>
        <button type="button" class="button is-primary" id="pj-dr-save">Сохранить</button>
        <button type="button" class="button is-light" id="pj-dr-cancel">Отмена</button>
        <span class="pj-spacer"></span>
        <span class="pj-dr__hint">Поля со * обязательны</span>
      </footer>
    </form>
  </aside>
  <div class="pj-toast" id="pj-toast" role="status" aria-live="polite"></div>

  <script type="application/json" id="pj-data">{{ projects_ctx|tojson }}</script>
  <script src="{{ url_for('static', filename='js/projects.js') }}"></script>
{% endblock %}
